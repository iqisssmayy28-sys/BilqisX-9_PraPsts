<!DOCTYPE html>
<html lang="en">
<head>
    <meta charshet="UTF-8">
    <meta name="viewport" content="width=device-width" initizial-scale="1.0">
    <title>ABBS Creativity Festival</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-5">

    
    <div class="container mx-auto max-w-lg bg-white p-6 border border-gray-300 rounded-lg">
        
        
        <h2 class="text-xl font-bold text-center mb-6">ABBS Creativity Festival</h2>
        <h2 class="text-xl font-bold text-center mb-5">Showcase your activity,skills and innovative ideas</h2>
        <h2 class="text-x1 font-bold text-center mb-4">There is Competition for shows bakat bakat yang dimiliki
            oleh siswa/siswi abbs secara individual or tim</h2>
        
        </h2>
        </>
        
        <form>
            
            
            
        
            <div class="mb-4">
                <label class="block font-semibold mb-1">Full name:</label>
                <!-- Form Styling: Mengatur padding, border, background, dan focus state -->
                <input type="text" class="w-full p-2 border border-gray-300 bg-gray-50 rounded focus:border-blue-500" required>
            </div>

            
            <div class="mb-4">
                <label class="block font-semibold mb-1">Class:</label>
                <div class="flex gap-4">
                    <label><input type="radio" name="Class" value="X" checked>X</label>
                    <label><input type="radio" name="Class" value="XI">XI</label>
                    <label><input type="radio" name="Class" value="XII">XII</label>
                </div>
            </div>


            <div class="mb-4">
                <label class="block font-semibold mb-1">Gender:</label>
                <div class="flex gap-4">
                    <label><input type="radio" name="Gender" value="Male" checked>Male</label>
                    <label><input type="radio" name="Gender" value="Female">Female</label>
                </div>

            <div class="mb-4">
                <label class="block font-semibold mb-1">Competition Category:</label>
                <class="flex gap-4">
                    <label><input type="radio" name="Competition Category" value="Web Development" checked>Web Development</label>
                    <label><input type="radio" name="Competition Category" value="IoT Project"IoT Project></label>
                    <label><input type="radio" name="Competition Category" value="Graphic Design">Graphic Design</label>
                    <label><input type="radio" name="Competition Category" value="Public Speaking"Public Speaking></label>
                    <label><input type="radio" name="Competition Category" value="Photography">Photography</label>
                </div>


                <div class="mb-4">
                <label class="block font-semibold mb-1">Tim Name:</label>
                <!-- Form Styling: Mengatur padding, border, background, dan focus state -->
                <input type="text" class="w-full p-2 border border-gray-300 bg-gray-50 rounded focus:border-blue-500" required>
                </div>

            
            <div class="mb-4">
                <label class="block font-semibold mb-1">Number of Participants:</label>
                <input type="number" class="w-full p-2 border border-gray-300 bg-gray-50 rounded focus:border-blue-500" required>
            </div>

            
            <div class="mb-6">
                <label class="block font-semibold mb-1">Project Description:</label>
                <textarea placeholder="Need internet access, need a projector, etc." class="w-full p-2 border border-gray-300 bg-gray-50 rounded focus:border-blue-500"></textarea>
            </div>

            
            <button type="Registration" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold p-2 rounded">
                Registration Reservation
            </button>
        </form>
    </div>

</body>
</html>:
